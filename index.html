<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER MARIO MIMIC - RETRO EDITION</title>
    <link rel="stylesheet" href="/src/styles/game.css">
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div class="ui-item">
                <span class="ui-label">MARIO</span>
                <span id="scoreValue">000000</span>
            </div>
            <div class="ui-item">
                <span class="ui-label">LIVES</span>
                <span id="livesValue">03</span>
            </div>
            <div class="ui-item">
                <span class="ui-label">WORLD</span>
                <span id="levelValue">1-1</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="1024" height="512"></canvas>
        <div id="gameOver" class="hidden">
            <h2>GAME OVER</h2>
            <p id="gameOverReason">YOUR QUEST HAS ENDED</p>
            <p>FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn">RETRY</button>
        </div>
        <div id="instructions">
            <p>LEFT/RIGHT ARROWS: MOVE | SPACE: JUMP</p>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
